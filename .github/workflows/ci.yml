name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      # Strictness comes from `[lints]` in `crates/server/Cargo.toml` — that
      # way the vendored `contrib/liana` crate isn't held to our standard.
      # `--no-deps` keeps clippy quiet about transitive dep warnings too.
      - run: cargo clippy -p walletrs --all-targets --no-deps

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - run: cargo test --workspace --no-fail-fast

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: walletrs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Don't block PRs on advisory churn (false positives, yanks for unrelated
    # reasons), but surface failures loudly so we notice quickly.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a release tag so config-format changes don't silently
      # break the gate.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Run all four check categories: advisories, bans, licenses,
          # sources. Config lives in `deny.toml` at the repo root.
          arguments: --all-features

  fuzz-check:
    name: fuzz targets compile
    runs-on: ubuntu-latest
    # `cargo fuzz` itself needs nightly because libfuzzer-sys does, but
    # `cargo check` from inside the fuzz crate (with the nightly toolchain
    # selected via rust-toolchain) is enough to catch drift in target
    # definitions without paying for a fuzz run.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/server/fuzz
      - name: install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: check fuzz targets compile
        working-directory: crates/server/fuzz
        run: cargo check --bins
